name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check repository scaffold
        run: test -s README.md && test -s LICENSE
      - uses: actions/setup-node@v6
        if: ${{ hashFiles('package-lock.json') != '' }}
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci --ignore-scripts
      - name: Typecheck, test, and build
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Compare with live OpenAPI
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run check:spec
